      @if (getActiveFilterCount() > 0) {
      <span class="active-badge">{{ getActiveFilterCount() }} active</span>
      }
    </div>
    @if (getActiveFilterCount() > 0) {
    <button mat-button color="warn" class="reset-btn" (click)="onReset()">
      Reset all
    </button>
    }
  </div>

  <mat-divider></mat-divider>

  <!-- Filter 2: Number of Stops -->
  <div class="filter-section">
    <label class="filter-label">Number of Stops</label>
    <div class="stops-list">
      @for (stop of stopOptions; track stop.value) {
      <mat-checkbox [checked]="isStopSelected(stop.value)" (change)="toggleStop(stop.value, $event.checked)"
        color="primary" class="stop-checkbox">
        <div class="stop-label-wrap">
          <span>{{ stop.label }}</span>
        </div>
      </mat-checkbox>
      }
    </div>
  </div>

  <mat-divider></mat-divider>

  <!-- Filter 3: Airline -->
  <div class="filter-section">
    <div class="filter-label-row">
      <label class="filter-label">Airlines</label>
      @if (selectedAirlines.length > 0) {
      <button mat-button class="clear-link-btn" (click)="clearAirlineFilter()">
        Clear
      </button>
      }
    </div>
    <div class="airlines-list">
      @for (airline of availableAirlines; track airline) {
      <mat-checkbox [checked]="isAirlineSelected(airline)" (change)="toggleAirline(airline, $event.checked)"
        color="primary" class="airline-checkbox">
        <span class="airline-name">{{ airline }}</span>
      </mat-checkbox>
      }
    </div>
  </div>
</div>
